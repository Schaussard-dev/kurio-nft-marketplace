name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the linux visual baselines (tests/visual) and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: the linux visual baselines were generated on this image; a new image changes font rendering.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CI: 'true'
      # Manual dispatch with update_snapshots, or a push whose head commit message contains [update-snapshots]
      # (fallback while the workflow is not on the default branch, where workflow_dispatch is unavailable).
      UPDATE_SNAPSHOTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.update_snapshots) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[update-snapshots]')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:unit

      - name: Production build (mocks off) ships no mock code
        run: |
          npm run build
          npm run check:prod-bundle

      - name: E2E + visual regression
        if: env.UPDATE_SNAPSHOTS != 'true'
        run: npm run test:e2e

      - name: Update linux visual baselines
        if: env.UPDATE_SNAPSHOTS == 'true'
        run: npm run test:e2e:update -- tests/visual

      - name: Upload visual baselines
        if: always() && env.UPDATE_SNAPSHOTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual/pages.visual.spec.ts-snapshots/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
