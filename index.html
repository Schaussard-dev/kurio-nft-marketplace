<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kurio, marketplace de NFTs: explore, compre e acompanhe coleções em tempo real." />
    <meta name="theme-color" content="#140D0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- LCP of the home page only: its first hero artwork (same candidates/sizes as the <picture> in Hero.tsx). -->
    <script>
      if (location.pathname === '/') {
        const hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.type = 'image/avif'
        hero.href = '/nfts/emerald-640.avif'
        hero.imageSrcset = '/nfts/emerald-320.avif 320w, /nfts/emerald-640.avif 640w, /nfts/emerald-1024.avif 1024w'
        hero.imageSizes = '(min-width: 1024px) 450px, 140px'
        hero.fetchPriority = 'high'
        document.head.append(hero)
      }
    </script>
    <title>Kurio — Marketplace de NFTs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
